{{ define "main" }}
<article class="article shell article-shell">
  <div class="article-layout">
    <div class="article-main">
      <header class="article-header">
        <a class="article-category-link" href="{{ .CurrentSection.RelPermalink }}">
          <span>Category</span>
          {{ .Section }}
        </a>
        <h1>{{ .Title }}</h1>
        <time class="article-date" datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006.01.02 15:04" }}</time>
        {{ with .Params.tags }}
          <div class="tags">
            {{ range . }}<span>#{{ . }}</span>{{ end }}
          </div>
        {{ end }}
      </header>

      <div class="content">
        {{ .Content }}
      </div>
    </div>

    {{ partial "toc.html" . }}
  </div>
</article>
{{ end }}
